name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-attribution:
    name: macOS fixture attribution · ${{ matrix.label }}
    runs-on: macos-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: untouched-nightly-ad11636
            source: ad11636d619be7304905e274666ba283ef71e03a
          - label: exact-pr156-0ee8a4e
            source: 0ee8a4e7f710076d617fa0b033e3b16510bb9f7d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: frozen project dependencies
        run: bun install --frozen-lockfile
      - name: establish private diagnostic environment and source binding
        shell: bash
        run: |
          root="$RUNNER_TEMP/fixture-attribution"
          mkdir -p "$root/agent" "$root/deck" "$root/home"
          echo "HOME=$root/home" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$root/agent" >> "$GITHUB_ENV"
          echo "NPI_DECK_HOME=$root/deck" >> "$GITHUB_ENV"
          echo "NPI_DECK_DB_PATH=$root/deck.db" >> "$GITHUB_ENV"
          git rev-parse HEAD
          git hash-object apps/server/src/routines/foundations.test.ts apps/server/src/routines-runner.ts apps/server/src/routines/v1-runner.ts apps/server/src/owned-process.ts
          bun --version
      - name: execute unchanged foundations test file once
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY DBUS_SESSION_BUS_ADDRESS NPI_DECK_PROCESS_GENERATION
          bun test apps/server/src/routines/foundations.test.ts
      - name: observe remaining diagnostic processes
        if: always()
        shell: bash
        run: |
          ps -axo pid,ppid,pgid,command
