name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands. Keeps the
# matrix from queueing duplicate work during rapid push sequences.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Disposable baseline diagnostic ref. Never merge this workflow.
  # Repository tests/runtime remain identical to nightly 2eb440ad.
  matrix:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        bun: ["1.3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: bun install (frozen)
        run: bun install --frozen-lockfile

      # The server's program includes NeoPi's sources (tsconfig.neopi.json), and its tests load a
      # real NeoPi backend. scripts/neopi-setup.ts prepares the tree pinned in neopi.pin: frozen
      # install, a native addon built from the tree's own sources and verified against the version
      # sentinel, backend registration in NPI_DECK_HOME, and tsconfig.neopi.json. The source clone
      # and NPI_DECK_HOME live under RUNNER_TEMP so `bun test` never discovers NeoPi's own tests.
      - name: fetch NeoPi at neopi.pin
        shell: bash
        run: |
          pin="$(tr -d '[:space:]' < neopi.pin)"
          src="$RUNNER_TEMP/neopi-source"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/PsychedelicShayna/neopi.git
          git -C "$src" fetch -q --depth 1 origin "$pin"
          git -C "$src" checkout -q --detach FETCH_HEAD
          echo "NPI_DECK_NEOPI_SOURCE=$src" >> "$GITHUB_ENV"
          echo "NPI_DECK_HOME=$RUNNER_TEMP/npi-deck-home" >> "$GITHUB_ENV"

      - name: prepare NeoPi backend (install, native addon, tsconfig)
        run: bun scripts/neopi-setup.ts --build-native

      - name: typecheck (all workspaces)
        run: bun run typecheck

      - name: classify untouched macOS MCP cases in clean and pre-load-poisoned processes
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          base=2eb440ad4593bb2d3c5382911de023a006eb2dd6
          git diff --exit-code "$base" -- apps packages scripts neopi.pin bun.lock package.json
          pin="$(tr -d '[:space:]' < neopi.pin)"
          test "$(git -C "$NPI_DECK_NEOPI_SOURCE" rev-parse HEAD)" = "$pin"
          export NPI_DECK_BACKEND="$NPI_DECK_HOME/neopi/$pin"
          test "$(git -C "$NPI_DECK_BACKEND" rev-parse HEAD)" = "$pin"
          bun --eval 'console.log("DIAG prepared SDK", Bun.resolveSync("@oh-my-pi/pi-coding-agent", process.env.NPI_DECK_BACKEND));'
          export NPI_MCP_DIAG_REPO="$GITHUB_WORKSPACE"
          export NPI_MCP_DIAG_ROOT="$(bun --eval 'import { mkdtempSync } from "node:fs"; import { tmpdir } from "node:os"; import * as path from "node:path"; console.log(mkdtempSync(path.join(tmpdir(), "mcp-classification-")));')"
          bun --eval '
            await Bun.write(process.env.NPI_MCP_DIAG_ROOT + "/poison-preload.ts", String.raw`
              import { beforeAll } from "bun:test";
              import { pathToFileURL } from "node:url";
              const root = process.env.NPI_MCP_DIAG_REPO;
              const runtime = await import(pathToFileURL(root + "/apps/server/src/backend/runtime.ts").href);
              const auth = await import(pathToFileURL(root + "/apps/server/src/auth-singleton.ts").href);
              if (runtime.activeBackend()) throw new Error("diagnostic requires no backend before poison");
              const before = auth.getDeckModelRegistry();
              let prior;
              try { await before; throw new Error("pre-load registry unexpectedly succeeded"); }
              catch (error) {
                if (!(error instanceof runtime.BackendConfigError)) throw error;
                prior = error;
                console.log("DIAG pre-load", error.name, error.message);
              }
              beforeAll(async () => {
                const backend = runtime.activeBackend();
                if (!backend) throw new Error("MCP fixture did not successfully load backend");
                console.log("DIAG loaded", backend.identity.commit, "agent", runtime.sdk().getAgentDir());
                const after = auth.getDeckModelRegistry();
                console.log("DIAG same registry promise", after === before);
                try { await after; console.log("DIAG registry recovered"); }
                catch (error) {
                  console.log("DIAG same rejected error", error === prior, error.name, error.message);
                }
              });
            `);
          '
          result=0
          for mode in clean poison; do
            private="$NPI_MCP_DIAG_ROOT/$mode"
            mkdir -p "$private/home" "$private/deck" "$private/agent" "$private/config" "$private/cache" "$private/data"
            export HOME="$private/home" NPI_DECK_HOME="$private/deck"
            export PI_CODING_AGENT_DIR="$private/agent"
            export XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" XDG_DATA_HOME="$private/data"
            echo "DIAG mode=$mode nightly=$base backend=$pin"
            set +e
            if [ "$mode" = poison ]; then
              bun test --preload "$NPI_MCP_DIAG_ROOT/poison-preload.ts" ./apps/server/src/routines/steps/mcp.test.ts 2>&1 | tee "$NPI_MCP_DIAG_ROOT/$mode.log"
            else
              bun test ./apps/server/src/routines/steps/mcp.test.ts 2>&1 | tee "$NPI_MCP_DIAG_ROOT/$mode.log"
            fi
            rc=${PIPESTATUS[0]}
            set -e
            echo "DIAG mode=$mode bun_exit=$rc"
            printf '%s\n' "$rc" > "$NPI_MCP_DIAG_ROOT/$mode.exit"
            if [ "$rc" -ne 0 ]; then result=1; fi
          done
          echo "NPI_MCP_DIAG_ROOT=$NPI_MCP_DIAG_ROOT" >> "$GITHUB_ENV"
          exit "$result"

      - name: retain macOS MCP classification evidence
        if: always() && runner.os == 'macOS' && env.NPI_MCP_DIAG_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: macos-mcp-classification
          path: |
            ${{ env.NPI_MCP_DIAG_ROOT }}/*.log
            ${{ env.NPI_MCP_DIAG_ROOT }}/*.exit
            ${{ env.NPI_MCP_DIAG_ROOT }}/poison-preload.ts
