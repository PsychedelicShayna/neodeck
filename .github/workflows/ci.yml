name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands. Keeps the
# matrix from queueing duplicate work during rapid push sequences.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Disposable baseline diagnostic ref. Never merge this workflow.
  # Repository tests/runtime remain identical to nightly 2eb440ad.
  matrix:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        bun: ["1.3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: bun install (frozen)
        run: bun install --frozen-lockfile

      # The server's program includes NeoPi's sources (tsconfig.neopi.json), and its tests load a
      # real NeoPi backend. scripts/neopi-setup.ts prepares the tree pinned in neopi.pin: frozen
      # install, a native addon built from the tree's own sources and verified against the version
      # sentinel, backend registration in NPI_DECK_HOME, and tsconfig.neopi.json. The source clone
      # and NPI_DECK_HOME live under RUNNER_TEMP so `bun test` never discovers NeoPi's own tests.
      - name: fetch NeoPi at neopi.pin
        shell: bash
        run: |
          pin="$(tr -d '[:space:]' < neopi.pin)"
          src="$RUNNER_TEMP/neopi-source"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/PsychedelicShayna/neopi.git
          git -C "$src" fetch -q --depth 1 origin "$pin"
          git -C "$src" checkout -q --detach FETCH_HEAD
          echo "NPI_DECK_NEOPI_SOURCE=$src" >> "$GITHUB_ENV"
          echo "NPI_DECK_HOME=$RUNNER_TEMP/npi-deck-home" >> "$GITHUB_ENV"

      - name: prepare NeoPi backend (install, native addon, tsconfig)
        run: bun scripts/neopi-setup.ts --build-native

      - name: typecheck (all workspaces)
        # Disposable diagnostic ref only: #145 prevents untouched Windows tests
        # from running. Preserve its failure, then observe the baseline tests.
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: bun run typecheck

      - name: diagnose untouched macOS deadline tests with only a fixture-root mapping
        if: runner.os == 'macOS'
        shell: bash
        run: |
          git diff --exit-code 2eb440ad4593bb2d3c5382911de023a006eb2dd6 -- apps packages scripts
          bun --eval '
            await Bun.write(process.env.RUNNER_TEMP + "/foundation-root-preload.ts", String.raw`
              import { mock } from "bun:test";
              import * as fs from "node:fs";
              import { tmpdir } from "node:os";
              import * as path from "node:path";
              const original = { ...fs };
              const root = path.join(tmpdir(), "nightly-baseline-fixtures");
              const legacy = "/home/shayna/tmp";
              const map = (file) => typeof file === "string" && (file === legacy || file.startsWith(legacy + "/")) ? root + file.slice(legacy.length) : file;
              mock.module("node:fs", () => ({
                ...original,
                mkdirSync: (file, options) => original.mkdirSync(map(file), options),
                mkdtempSync: (prefix, options) => original.mkdtempSync(map(prefix), options),
              }));
              console.log("Diagnostic: filesystem prefix remapped; nightly test and runtime sources unchanged");
            `);
          '
          bun test --preload "$RUNNER_TEMP/foundation-root-preload.ts" apps/server/src/routines/foundations.test.ts -t "deadline kills shell grandchild|run-duration budget"

      - name: diagnose untouched Windows test suite
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git diff --exit-code 2eb440ad4593bb2d3c5382911de023a006eb2dd6 -- apps packages scripts
          bun test
